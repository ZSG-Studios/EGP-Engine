name: Test project converter
description: Validate the 3-to-4 project converter.

inputs:
  bin:
    description: Path to the engine binary.
    required: true

runs:
  using: composite
  steps:
    - name: Test 3-to-4 conversion
      shell: sh
      run: |
        mkdir converter_test
        cd converter_test
        touch project.godot
        ../${{ inputs.bin }} --headless --validate-conversion-3to4
        cd ..
        rm converter_test -rf
