name: 🤖 Android Builds
on:
  workflow_call:
    secrets:
      SERVICE_ACCOUNT_KEY:
        # Only the upstream-only Firebase steps consume this credential.
        required: false

  workflow_dispatch:

# Global Settings
# EGP physics backends currently require a single-precision desktop target.
env:
  XMAKE_FLAGS: >-
    dev_mode=yes
    module_text_server_fb_enabled=yes
    disable_physics_2d=yes
    disable_physics_3d=yes

jobs:
  build-android:
    runs-on: ubuntu-26.04
    name: ${{ matrix.name }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Android editors require physics; EGP's backends currently support desktop only.
          # Keep mobile export builds explicit about their available capabilities.
          - name: Template arm32 (target=template_debug, arch=arm32)
            cache-name: android-template-arm32
            target: template_debug
            instrumented_tests: false
            xmake-flags: arch=arm32

          - name: Template arm64 (target=template_debug, arch=arm64)
            cache-name: android-template-arm64
            target: template_debug
            instrumented_tests: true
            xmake-flags: arch=arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Verify native Gradle routing without legacy build tools
        shell: bash
        run: |
          cd platform/android/java
          ./gradlew --version
          GRADLE_VERSION="$(sed -n 's/.*gradle-\([0-9.]*\)-bin.zip/\1/p' gradle/wrapper/gradle-wrapper.properties)"
          GROOVY_JAR="$(find "${GRADLE_USER_HOME:-$HOME/.gradle}/wrapper/dists" -path "*/gradle-$GRADLE_VERSION/lib/groovy-[0-9]*.jar" -print -quit)"
          test -n "$GROOVY_JAR"
          java -cp "$GROOVY_JAR" groovy.ui.GroovyMain "$GITHUB_WORKSPACE/tests/build/test_android_xmake.groovy" "$GITHUB_WORKSPACE"

      - name: Install the Gradle-pinned Android NDK
        shell: sh
        run: |
          NDK_VERSION="$(awk -F "'" '/^[[:space:]]*ndkVersion[[:space:]]*:/ { print $2; exit }' platform/android/java/app/config.gradle)"
          test -n "$NDK_VERSION"
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          NDK_ROOT="$SDK_ROOT/ndk/$NDK_VERSION"
          if [ ! -x "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]; then
            sdkmanager --sdk_root="$SDK_ROOT" "ndk;$NDK_VERSION"
          fi
          test -x "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          printf 'ANDROID_NDK_ROOT=%s\nANDROID_NDK_HOME=%s\n' "$NDK_ROOT" "$NDK_ROOT" >> "$GITHUB_ENV"

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Setup native xmake
        uses: ./.github/actions/godot-deps

      - name: Download pre-built AccessKit
        shell: sh
        id: accesskit-sdk
        run: |
          if xmake lua misc/scripts/install_build_dependencies.lua accesskit; then
            echo "ACCESSKIT_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::AccessKit SDK installation failed, building without AccessKit support."
            echo "ACCESSKIT_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Swappy
        shell: sh
        id: swappy_sdk
        run: |
          if xmake lua misc/scripts/install_build_dependencies.lua swappy; then
            echo "SWAPPY_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Swappy installation failed, building without Swappy support."
            echo "SWAPPY_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Perfetto
        shell: sh
        id: perfetto_sdk
        run: |
          if xmake lua misc/scripts/install_build_dependencies.lua perfetto; then
            echo "PROFILER_ENABLED=perfetto" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Perfetto installation failed, building without Perfetto support."
            echo "PROFILER_ENABLED=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilation
        uses: ./.github/actions/godot-build
        with:
          xmake-flags: ${{ env.XMAKE_FLAGS }} ${{ matrix.xmake-flags }} profiler=${{ steps.perfetto_sdk.outputs.PROFILER_ENABLED || 'none' }} swappy=${{ steps.swappy_sdk.outputs.SWAPPY_ENABLED || 'no' }} accesskit=${{ steps.accesskit-sdk.outputs.ACCESSKIT_ENABLED || 'no' }}
          platform: android
          target: ${{ matrix.target }}

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Generate Godot templates
        if: matrix.target == 'template_debug'
        run: |
          cd platform/android/java
          ./gradlew generateGodotTemplates
          cd ../../..
          ls -l bin/

      - name: Generate Godot editor
        if: matrix.target == 'editor'
        run: |
          cd platform/android/java
          ./gradlew generateGodotEditor
          ./gradlew generateGodotHorizonOSEditor
          ./gradlew generateGodotPicoOSEditor
          cd ../../..
          ls -l bin/android_editor_builds/

          # Separate different editors for multiple artifacts
          mkdir horizonos
          mv bin/android_editor_builds/*-horizonos-* horizonos
          mkdir picoos
          mv bin/android_editor_builds/*-picoos-* picoos

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: ${{ matrix.cache-name }}

      - name: Upload artifact (Horizon OS)
        if: matrix.target == 'editor'
        uses: ./.github/actions/upload-artifact
        with:
          name: ${{ matrix.cache-name }}-horizonos
          path: horizonos

      - name: Upload artifact (PICO OS)
        if: matrix.target == 'editor'
        uses: ./.github/actions/upload-artifact
        with:
          name: ${{ matrix.cache-name }}-picoos
          path: picoos

      - name: Generate Instrumented test APKs
        if: matrix.instrumented_tests && github.repository == 'godotengine/godot' && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        run: |
          cd platform/android/java
          if [ "${{ matrix.target }}" = "editor" ]; then
            ./gradlew :editor:assembleAndroidAndroidTest :editor:assembleAndroidDebug -Pperform_signing=true
          else
            ./gradlew :app:assembleAndroidTest :app:assembleInstrumentedDebug -Pperform_signing=true
          fi
          cd ../../..

      - name: Create credentials file
        if: matrix.instrumented_tests && github.repository == 'godotengine/godot' && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.SERVICE_ACCOUNT_KEY }}

      - name: Set up gcloud CLI
        if: matrix.instrumented_tests && github.repository == 'godotengine/godot' && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        uses: google-github-actions/setup-gcloud@v3

      - name: Run tests on Firebase Test Lab
        if: matrix.instrumented_tests && github.repository == 'godotengine/godot' && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        run: |
          set +e

          if [ "${{ matrix.target }}" = "editor" ]; then
            APP_APK="platform/android/java/editor/build/outputs/apk/android/debug/android_editor-android-debug.apk"
            TEST_APK="platform/android/java/editor/build/outputs/apk/androidTest/android/debug/android_editor-android-debug-androidTest.apk"
          else
            APP_APK="platform/android/java/app/build/outputs/apk/instrumented/debug/android_debug.apk"
            TEST_APK="platform/android/java/app/build/outputs/apk/androidTest/instrumented/debug/app-instrumented-debug-androidTest.apk"
          fi

          output=$(gcloud firebase test android run \
            --type instrumentation \
            --app "$APP_APK" \
            --test "$TEST_APK" \
            --device model=MediumPhone.arm,version=26 \
            --device model=java,version=30 \
            --device model=MediumPhone.arm,version=32 \
            --device model=MediumTablet.arm,version=35 \
            --device model=rango,version=36 \
            --use-orchestrator \
            --timeout 2m 2>&1)
          exit_code=$?
          echo "$output"
          if [[ $exit_code -eq 1 && "$output" == *"TEST_QUOTA_EXCEEDED"* ]]; then
            echo "::warning title=Firebase Test Lab::Test quota exceeded."
            exit_code=0
          fi
          exit "$exit_code"
