name: Physics · Box2D
# Pinned Box2D source integrity and deterministic validation on every desktop platform.
on:
  push:
    branches: [master]
    paths:
      - 'thirdparty/box2d/**'
      - 'modules/box2d/**'
      - 'tests/physics/box2d/**'
      - 'misc/scripts/validate_box2d.py'
      - 'misc/scripts/egp_xmake.py'
      - 'misc/scripts/test_egp_xmake_qualification.py'
      - 'misc/xmake/**'
      - 'xmake.lua'
      - 'build/xmake/**'
      - '.github/workflows/physics-box2d.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.os }} · ${{ matrix.configuration }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows, linux, macos]
        configuration: [Debug, Release]
        # Clang everywhere: clang on Linux, Apple Clang (xcode) on macOS.
        # TODO(W9 clang-cl): set `toolchain: clang-cl` for Windows once LLVM is pinned on the runner.
        include:
          - os: windows
            toolchain: ''
          - os: linux
            toolchain: clang
          - os: macos
            toolchain: ''
    runs-on: [self-hosted, 'egp-${{ matrix.os }}']
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Acquire Mac build lock
        if: runner.os == 'macOS'
        uses: ./.github/actions/lock-mac-host
        with:
          mode: acquire

      - name: Validate Box2D
        run: python misc/scripts/validate_box2d.py --configuration ${{ matrix.configuration }} ${{ matrix.toolchain && format('--toolchain {0}', matrix.toolchain) || '' }}

      - name: Release Mac build lock
        if: always() && runner.os == 'macOS'
        uses: ./.github/actions/lock-mac-host
        with:
          mode: release

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: box2d-${{ matrix.os }}-${{ matrix.configuration }}
          path: .build/box2d-validation/
          retention-days: 14
