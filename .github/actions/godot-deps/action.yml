name: Setup native xmake
description: Install the pinned native xmake build tool and compiler feedback.
runs:
  using: composite
  steps:
    - uses: ilammy/msvc-dev-cmd@v1
      if: runner.os == 'Windows'
    - uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: '3.1.1'
    - name: Check tools and compiler feedback
      shell: bash
      run: |
        xmake --version
        echo ::add-matcher::misc/utility/problem-matchers.json
