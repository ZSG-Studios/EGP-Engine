name: Native xmake build contracts
on:
  workflow_call:
  workflow_dispatch:
jobs:
  native-contract:
    name: Native Lua contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            architecture: x64
            suffix: .exe
          - os: ubuntu-latest
            platform: linux
            architecture: x86_64
            suffix: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/godot-deps
      - name: Build native compression and ZIP tools
        shell: bash
        env:
          XMAKE_CONFIGDIR: ${{ github.workspace }}/.build/xmake-contract-tools/config
          XMAKE_GLOBALDIR: ${{ github.workspace }}/.build/xmake-global/contracts
        run: |
          cd build/xmake/tools
          xmake f -y --toolchain="${{ runner.os == 'Windows' && 'msvc' || 'gcc' }}" -P "$GITHUB_WORKSPACE/build/xmake/tools" -o "$GITHUB_WORKSPACE/.build/xmake-contract-tools" -p "${{ matrix.platform }}" -a "${{ matrix.architecture }}" -m release
          xmake -P "$GITHUB_WORKSPACE/build/xmake/tools" -b -j 2
      - name: Verify native policy, generators and artifact graphs
        shell: bash
        run: |
          xmake lua misc/scripts/validate_xmake_contract.lua "$GITHUB_WORKSPACE/.build/xmake-contract-tools/bin/egp_compress${{ matrix.suffix }}" "$GITHUB_WORKSPACE/.build/xmake-contract-tools/bin/egp_zip${{ matrix.suffix }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xmake-native-contract-${{ matrix.platform }}
          path: .build/xmake-contract/
