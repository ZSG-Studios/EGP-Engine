name: Save Godot build cache
description: Save Godot build cache.
inputs:
  cache-name:
    description: The cache base name (job name by default).
    default: ${{ github.job }}
  build-cache:
    description: The native xmake build directory.
    default: ${{ github.workspace }}/.build/xmake-cache/

runs:
  using: composite
  steps:
    - name: Save xmake build directory
      uses: actions/cache/save@v6
      with:
        path: ${{ inputs.build-cache }}
        key: xmake-3.1.1|${{ inputs.cache-name }}|${{ github.ref_name }}|${{ github.sha }}

    # This is done after saving the new cache so that the base cache remains more relevant, to reduce
    # the risk of the cache being purged when multiple large PRs are pushed/merged at the same time.
    - name: Ping default cache
      uses: actions/cache/restore@v6
      if: github.ref_name != github.event.repository.default_branch
      with:
        path: ${{ inputs.build-cache }}
        key: xmake-3.1.1|${{ inputs.cache-name }}|${{ github.event.repository.default_branch }}|${{ github.sha }}
        restore-keys: xmake-3.1.1|${{ inputs.cache-name }}|${{ github.event.repository.default_branch }}
        lookup-only: true
