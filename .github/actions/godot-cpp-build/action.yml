name: Build godot-cpp fixture
description: Compile the pinned upstream extension fixture against EGP's matching SDK using native xmake.
inputs:
  bin:
    description: Path to the EGP editor.
    required: true
runs:
  using: composite
  steps:
    - name: Prepare matching pinned upstream fixture
      shell: bash
      run: |
        xmake lua misc/scripts/prepare_godot_cpp_fixture.lua "${{ github.workspace }}/.build/upstream-cpp-fixture"
    - name: Extract matching API and SDK
      shell: bash
      env:
        EGP_EDITOR: ${{ inputs.bin }}
      run: |
        "$EGP_EDITOR" --headless --dump-gdextension-interface --dump-extension-api
        xmake lua misc/scripts/extract_egp_cpp_sdk.lua --api "${{ github.workspace }}/extension_api.json" --output "${{ github.workspace }}/.build/upstream-cpp-sdk"
    - name: Build extension with xmake
      shell: bash
      run: |
        xmake lua misc/scripts/build_egp_cpp_extension.lua --project "${{ github.workspace }}/.build/upstream-cpp-fixture/test" --sdk "${{ github.workspace }}/.build/upstream-cpp-sdk" --build-dir "${{ github.workspace }}/.build/upstream-cpp-extension" --output-dir "${{ github.workspace }}/.build/upstream-cpp-fixture/test/project/bin" --name libmytest.linux.template_debug.x86_64 --sources 'src/**.cpp' --mode debug --platform linux --arch x86_64 --doc-classes "${{ github.workspace }}/.build/upstream-cpp-fixture/test/doc_classes" --compressor "${{ github.workspace }}/.build/xmake-host-tools/linux-x86_64/bin/egp_compress"
