name: Restore Godot build cache
description: Restore Godot build cache.
inputs:
  cache-name:
    description: The cache base name (job name by default).
    default: ${{ github.job }}
  build-cache:
    description: The native xmake build directory.
    default: ${{ github.workspace }}/.build/xmake-cache/

runs:
  using: composite
  steps:
    - name: Restore default cache
      uses: actions/cache/restore@v6
      id: cache-ping
      with:
        path: ${{ inputs.build-cache }}
        key: xmake-3.1.1|${{ inputs.cache-name }}|${{ github.event.repository.default_branch }}|${{ github.sha }}
        restore-keys: xmake-3.1.1|${{ inputs.cache-name }}|${{ github.event.repository.default_branch }}

    # This is done after pulling the default cache so that PRs can integrate any potential changes
    # from the default branch without conflicting with whatever local changes were already made.
    - name: Restore local cache
      uses: actions/cache/restore@v6
      if: github.ref_name != github.event.repository.default_branch
      with:
        path: ${{ inputs.build-cache }}
        key: xmake-3.1.1|${{ inputs.cache-name }}|${{ github.ref_name }}|${{ github.sha }}
        restore-keys: xmake-3.1.1|${{ inputs.cache-name }}|${{ github.ref_name }}
