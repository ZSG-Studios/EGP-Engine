plugins {
    id 'com.android.fused-library'
}

androidFusedLibrary {
    namespace = 'com.godot.game.fuseddeps'
    // AGP 9 fused libraries take the minimum SDK through the MinSdkSpec block.
    minSdk {
        version = release(versions.minSdk)
    }
}

dependencies {
    include project(":dataLib")

    // Godot user plugins remote dependencies
    String[] remoteDeps = getGodotPluginsRemoteBinaries()
    if (remoteDeps != null && remoteDeps.size() > 0) {
        def platformPattern = /^\s*(platform|enforcedPlatform)\s*\(\s*['"]*(\S+)['"]*\s*\)$/
        for (String dep : remoteDeps) {
            def matcher = dep =~ platformPattern
            if (!matcher) {
                logger.lifecycle("Including dep $dep")
                include dep
            }
        }
    }
}
