plugins {
    id 'com.android.library'
}

// Declare the shared versions and helpers in this project (Gradle 10 removes implicit lookup in parent projects).
apply from: '../config.gradle'

dependencies {
    implementation "androidx.fragment:fragment:$versions.fragmentVersion"
    implementation "androidx.core:core-splashscreen:$versions.splashscreenVersion"

    if (rootProject.findProject(":lib")) {
        compileOnly project(":lib")
    } else if (rootProject.findProject(":godot:lib")) {
        compileOnly project(":godot:lib")
    } else {
        // Godot gradle build mode. In this scenario this project is the only one around and the Godot
        // library is available through the pre-generated godot-lib.*.aar android archive files.
        debugCompileOnly fileTree(dir: '../libs/debug', include: ['**/*.jar', '*.aar'])
        releaseCompileOnly fileTree(dir: '../libs/release', include: ['**/*.jar', '*.aar'])
    }
}

android {
    namespace = 'com.godot.game'
    compileSdk = versions.compileSdk
    compileSdkMinor = versions.compileSdkMinor

    androidResources {
        // The default ignore pattern for the 'assets' directory includes hidden files and directories which are used by Godot projects.
        ignoreAssetsPattern = "!.svn:!.git:!.gitignore:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~"
    }

    defaultConfig {
        minSdk = versions.minSdk

        missingDimensionStrategy 'products', 'template'
    }
    compileOptions {
        sourceCompatibility = versions.javaVersion
        targetCompatibility = versions.javaVersion
    }
    buildFeatures {
        buildConfig = true
    }

}
