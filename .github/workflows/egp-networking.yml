name: Superpos native networking
on:
  push:
    paths: ["modules/superpos/**", "misc/egp/superpos_lab/**", "misc/scripts/validate_superpos.py", "build/xmake/**", "xmake.lua", ".github/workflows/egp-networking.yml"]
  pull_request:
    paths: ["modules/superpos/**", "misc/egp/superpos_lab/**", "misc/scripts/validate_superpos.py", "build/xmake/**", "xmake.lua", ".github/workflows/egp-networking.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: superpos-networking-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  native-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/godot-deps
      - name: Build current Superpos native editor
        shell: bash
        run: xmake lua misc/scripts/build_egp.lua windows editor 4 .build/xmake-cache "arch=x86_64 dev_build=yes debug_symbols=no module_mono_enabled=no accesskit=no d3d12=no"
      - name: Check native API, canonical ownership and authenticated loopback
        run: python misc/scripts/validate_superpos.py --engine bin/godot.windows.editor.dev.x86_64.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: superpos-native-windows
          path: .build/diagnostics/superpos
