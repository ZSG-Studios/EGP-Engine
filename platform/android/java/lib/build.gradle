plugins {
    id 'com.android.library'
}

// Declare the shared versions and helpers in this project (Gradle 10 removes implicit lookup in parent projects).
apply from: '../app/config.gradle'

ext {
    DEBUG_PUBLISH_ARTIFACT_ID = 'godot-debug'
    PUBLISH_ARTIFACT_ID = 'godot'
    TOOLS_PUBLISH_ARTIFACT_ID = 'godot-tools'
}

apply from: "../scripts/publish-module.gradle"

dependencies {
    implementation "androidx.fragment:fragment:$versions.fragmentVersion"
    implementation "androidx.documentfile:documentfile:$versions.documentfileVersion"

    testImplementation "junit:junit:4.13.2"
}

def pathToRootDir = "../../../../"

// Archives are named 'godot-lib-<flavor>-<buildType>.aar'; the root project's copy tasks rename
// them to the 'godot-lib.<target>.aar' names Godot expects.
base {
    archivesName = "godot-lib"
}

android {
    compileSdk = versions.compileSdk
    compileSdkMinor = versions.compileSdkMinor
    buildToolsVersion = versions.buildTools
    ndkVersion = versions.ndkVersion

    defaultConfig {
        minSdk = versions.minSdk

        manifestPlaceholders = [godotLibraryVersion: getGodotLibraryVersionName()]
    }

    testOptions {
        targetSdk = versions.targetSdk
    }

    namespace = "org.godotengine.godot"

    compileOptions {
        sourceCompatibility = versions.javaVersion
        targetCompatibility = versions.javaVersion
    }

    buildFeatures {
        aidl = true
        buildConfig = true
    }

    flavorDimensions = ["products"]
    productFlavors {
        editor {}
        template {}
    }

    lint {
        abortOnError = false
        disable += ['MissingTranslation', 'UnusedResources']
    }

    packaging {
        resources {
            excludes += ['META-INF/LICENSE', 'META-INF/NOTICE']
        }

        // Debug symbols are kept for development within Android Studio.
        if (shouldNotStrip()) {
            jniLibs {
                keepDebugSymbols += '**/*.so'
            }
        }
    }

    sourceSets {
        debug.jniLibs.srcDirs = ['libs/debug']
        release.jniLibs.srcDirs = ['libs/release']

        // Editor jni library
        editorRelease.jniLibs.srcDirs = ['libs/tools/release']
        editorDebug.jniLibs.srcDirs = ['libs/tools/debug']
    }

    publishing {
        singleVariant("templateDebug") {
            withSourcesJar()
            withJavadocJar()
        }
        singleVariant("templateRelease") {
            withSourcesJar()
            withJavadocJar()
        }
        singleVariant("editorRelease") {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

// BEGIN native build tasks
// One xmake task per product flavor, build type and selected ABI. They are registered from the
// static flavor/build type table (the old variant API is gone in AGP 9) and wired lazily, by name,
// into the matching JNI merge task so the generated libraries exist before the AAR is packaged.
// Closure parameters (not shared 'for' loop variables) keep each task's flavor/build type/ABI.
rootProject.supportedFlavorsBuildTypes.each { String flavorName, List<String> buildTypes ->
    buildTypes.each { String buildType ->
        rootProject.selectedAbis.each { String nativeAbi ->
            if (!rootProject.supportedAbis.contains(nativeAbi)) {
                throw new GradleException("Invalid selected abi: $nativeAbi")
            }

            String taskName = rootProject.getNativeTaskName(flavorName, buildType, nativeAbi)
            tasks.register(taskName, Exec) {
                workingDir file(pathToRootDir)
                // Resolve the tool only when native compilation is requested. Prebuilt
                // library packaging must configure without a compiler on PATH.
                doFirst {
                    String xmake = project.findProperty("xmakeExecutable") ?: System.getenv("XMAKE") ?: System.getenv("XMAKE_EXE") ?: "xmake"
                    commandLine rootProject.getGodotNativeBuildCommand(flavorName, buildType, nativeAbi, file(pathToRootDir), xmake)
                }
            }

            String mergeTaskName = "merge${flavorName.capitalize()}${buildType.capitalize()}JniLibFolders"
            tasks.named { it == mergeTaskName }.configureEach { dependsOn taskName }
        }
    }
}
// END native build tasks
