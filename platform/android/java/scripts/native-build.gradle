// Shared native command construction; Gradle continues to own Android packaging.
ext.getNativeTaskName = { String flavor, String buildType, String abi ->
    return "compileGodotNativeLibs" + flavor.capitalize() + buildType.capitalize() + abi.capitalize()
}

ext.getGodotNativeBuildCommand = { String flavor, String buildType, String abi, File engineRoot, String executable ->
    if (!(flavor in ["editor", "template"]) || !(buildType in ["debug", "release"]) ||
        !(abi in ["arm32", "arm64", "x86_32", "x86_64"])) {
        throw new GradleException("Invalid native Android build variant: $flavor/$buildType/$abi")
    }
    boolean debugBuild = buildType == "debug"
    String target = flavor == "editor" ? "editor" : "template_$buildType"
    List<String> options = [
        "arch=$abi", "store_release=${!debugBuild}", "production=${!debugBuild}",
        "dev_mode=$debugBuild", "dev_build=$debugBuild", "debug_symbols=$debugBuild",
        "tests=${debugBuild && flavor == 'editor'}", "generate_android_binaries=no",
        "disable_physics_2d=yes", "disable_physics_3d=yes"
    ]
    return [executable, "lua", new File(engineRoot, "misc/scripts/build_egp.lua").absolutePath,
        "android", target, Runtime.runtime.availableProcessors().toString(),
        new File(engineRoot, ".build/xmake-cache").absolutePath, options.join(" ")]
}
