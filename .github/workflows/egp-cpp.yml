name: EGP C++ editor and exports
on:
  push:
    branches: [master]
    paths: ["core/extension/**", "drivers/windows/file_access_windows_pipe.*", "editor/editor_node.*", "editor/doc/editor_help.*", "editor/settings/gdextension/**", "misc/scripts/*egp_cpp*", ".github/workflows/egp-cpp.yml", ".gitmodules", "thirdparty/godot-cpp"]
  pull_request:
    paths: ["core/extension/**", "drivers/windows/file_access_windows_pipe.*", "editor/editor_node.*", "editor/doc/editor_help.*", "editor/settings/gdextension/**", "misc/scripts/*egp_cpp*", ".github/workflows/egp-cpp.yml", ".gitmodules", "thirdparty/godot-cpp"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: egp-cpp-${{ github.head_ref || github.ref_name }}
  # Finish the editor/template matrix already compiling before starting its successor.
  cancel-in-progress: false
jobs:
  native-cpp:
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x86_64
            editor: bin/godot.windows.editor.dev.x86_64.console.exe
            debug: bin/godot.windows.template_debug.x86_64.exe
            release: bin/godot.windows.template_release.x86_64.exe
            flags: d3d12=no
          - os: ubuntu-24.04
            platform: linuxbsd
            arch: x86_64
            editor: bin/godot.linuxbsd.editor.dev.x86_64
            debug: bin/godot.linuxbsd.template_debug.x86_64
            release: bin/godot.linuxbsd.template_release.x86_64
            flags: x11=no wayland=no
          - os: macos-15
            platform: macos
            arch: arm64
            editor: bin/godot.macos.editor.dev.arm64
            debug: bin/godot.macos.template_debug.arm64
            release: bin/godot.macos.template_release.arm64
            flags: metal=no
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install scons==4.11.1
      - name: Build headless validation editor and production templates
        shell: bash
        run: |
          FLAGS="platform=${{ matrix.platform }} arch=${{ matrix.arch }} debug_symbols=no angle=no accesskit=no vulkan=no opengl3=no module_mono_enabled=no ${{ matrix.flags }}"
          python misc/scripts/build_egp_cpp_editor.py -- -j4 $FLAGS dev_build=yes
          python -m SCons -j4 $FLAGS target=template_debug
          python -m SCons -j4 $FLAGS target=template_release
      - run: python misc/scripts/test_egp_cpp_sdk.py
      - name: Validate CLI and exported games
        run: python misc/scripts/validate_egp_cpp.py --editor ${{ matrix.editor }} --debug-template ${{ matrix.debug }} --release-template ${{ matrix.release }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpp-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            .build/cpp-qualification/*.log
            .build/cpp-qualification/results.json
