name: Experimental visionOS Forward+
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Optional successful native-build run to reuse for export-only changes'
        required: false
        type: string
        default: ''
      metal_sync_mode:
        description: 'Metal synchronization diagnostic for a reused editor'
        required: false
        type: choice
        options: [default, none]
        default: none
  push:
    branches: [experimental/visionos-forward-plus]
  pull_request:
    paths:
      - 'main/main.cpp'
      - 'platform/visionos/**'
      - 'modules/visionos_xr/**'
      - 'servers/rendering/renderer_rd/**'
      - 'misc/egp/visionos_forward_plus/**'
      - 'misc/scripts/validate_visionos_forward_plus.py'
      - 'misc/scripts/validate_visionos_export.py'
      - '.github/workflows/visionos_experimental.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: visionos-experimental-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reuse-builds:
    name: Verify unchanged native sources before reusing builds
    if: inputs.source_run_id != ''
    runs-on: ubuntu-24.04
    steps:
      - name: Verify source run and changed files
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          python3 - <<'PY'
          import base64, json, os, re, subprocess
          from pathlib import Path
          run_id = os.environ['SOURCE_RUN_ID']
          assert run_id.isdigit(), 'Source run ID must be numeric'
          repo = os.environ['GITHUB_REPOSITORY']
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/{path}']))
          source = api(f'actions/runs/{run_id}')
          assert source['name'] == 'Experimental visionOS Forward+', 'Unexpected source workflow'
          assert source['status'] == 'completed', 'Source run has not finished'
          required = {'visionOS device compilation (not runtime validation)',
                      'External stereo textures on software Vulkan'}
          jobs = api(f'actions/runs/{run_id}/jobs?per_page=100')['jobs']
          passed = {job['name'] for job in jobs if job['conclusion'] == 'success'}
          assert required <= passed, 'Native build and stereo checks must have passed'
          metal = next(job for job in jobs if job['name'] == 'Metal capability and external stereo test')
          steps = {step['name'] for step in metal['steps'] if step['conclusion'] == 'success'}
          assert {'Compile Metal editor', 'Upload matching macOS editor'} <= steps, 'Metal editor build must have passed'
          comparison = api(f"compare/{source['head_sha']}...{os.environ['GITHUB_SHA']}")
          assert comparison['status'] in ('ahead', 'identical'), 'Candidate must descend from source build'
          files = comparison.get('files', [])
          assert len(files) < 300, 'Comparison may be truncated'
          def build_options(ref):
              data = api(f'contents/.github/workflows/visionos_experimental.yml?ref={ref}')
              text = base64.b64decode(data['content']).decode()
              return re.findall(r'^\s+(?:platform|target|xmake-flags):.*$', text, re.M)
          assert build_options(source['head_sha']) == build_options(os.environ['GITHUB_SHA']), 'Native build options changed'
          allowed = {'.github/workflows/visionos_experimental.yml',
                     'misc/scripts/validate_visionos_export.py',
                     'misc/scripts/validate_visionos_forward_plus.py',
                     'doc/egp_visionos_experimental.md', 'README.md'}
          for file in files:
              assert file['status'] in ('added', 'modified'), 'Renamed or removed files require a rebuild'
              if file['filename'] == 'misc/egp/visionos_forward_plus/project.godot':
                  changes = [line for line in file['patch'].splitlines() if line.startswith(('+', '-'))]
                  assert changes == ['+textures/vram_compression/import_etc2_astc=true'], 'Only the export import setting may change'
              else:
                  assert file['filename'] in allowed, f"Native or runtime source changed: {file['filename']}"
          receipt = {'source_run_id': run_id, 'native_source_commit': source['head_sha'],
                     'export_source_commit': os.environ['GITHUB_SHA'],
                     'changed_files': [file['filename'] for file in files], 'device_validated': False}
          Path('build-reuse.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: visionos-experimental-build-reuse
          path: build-reuse.json
  device-build:
    if: inputs.source_run_id == ''
    name: visionOS device compilation (not runtime validation)
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/godot-deps
      - name: Record Apple toolchain
        run: |
          mkdir -p .build/visionos-experimental
          xcodebuild -version | tee .build/visionos-experimental/xcode.txt
          xcrun --sdk xros --show-sdk-version | tee .build/visionos-experimental/sdk.txt
      - name: Compile device library including immersive module
        uses: ./.github/actions/godot-build
        with:
          platform: visionos
          target: template_debug
          xmake-flags: arch=arm64 dev_mode=yes debug_symbols=no metal=yes vulkan=no module_visionos_xr_enabled=yes generate_bundle=yes
      - name: Check packaged debug template
        run: |
          python3 - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          template = Path("bin/godot_visionos.zip")
          library = "libgodot.visionos.debug.xcframework/xros-arm64/libgodot.a"
          with zipfile.ZipFile(template) as archive:
              assert archive.getinfo(library).file_size > 0, "Device library missing from template"
              assert archive.testzip() is None, "Corrupt template ZIP"
          receipt = {"template": str(template), "sha256": hashlib.sha256(template.read_bytes()).hexdigest(),
                     "library": library, "scope": "Packaged debug template only; no signed app or device test"}
          Path(".build/visionos-experimental/template.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print("EGP_VISIONOS_TEMPLATE_PASS", json.dumps(receipt))
          PY
      - name: Upload device library and toolchain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visionos-experimental-device
          include-hidden-files: true
          path: |
            bin/
            .build/visionos-experimental/
  stereo-vulkan:
    if: inputs.source_run_id == ''
    name: External stereo textures on software Vulkan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/godot-deps
      - name: Install software graphics dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-bin mesa-vulkan-drivers xvfb
      - name: Compile Forward+ editor
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          xmake-flags: dev_mode=yes debug_symbols=no vulkan=yes accesskit=no module_mono_enabled=no
      - name: Render and read both eyes and depth, then resize
        run: |
          xvfb-run -a python3 misc/scripts/validate_visionos_forward_plus.py --engine bin/godot.linuxbsd.editor.x86_64 --driver vulkan --output .build/visionos-experimental
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visionos-experimental-vulkan
          include-hidden-files: true
          path: .build/visionos-experimental/
  stereo-metal:
    if: inputs.source_run_id == ''
    name: Metal capability and external stereo test
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/godot-deps
      - name: Compile Metal editor
        uses: ./.github/actions/godot-build
        with:
          platform: macos
          target: editor
          xmake-flags: arch=arm64 dev_mode=yes debug_symbols=no metal=yes vulkan=no accesskit=no module_mono_enabled=no
      - name: Check runner architecture and Metal device
        id: capability
        run: |
          mkdir -p .build/visionos-experimental
          cat > .build/visionos-experimental/probe.swift <<'SWIFT'
          import Metal
          import Foundation
          if let device = MTLCreateSystemDefaultDevice() {
              print("METAL_DEVICE=" + device.name)
          } else {
              print("METAL_DEVICE_UNAVAILABLE")
          }
          SWIFT
          uname -m | tee .build/visionos-experimental/architecture.txt
          swift .build/visionos-experimental/probe.swift | tee .build/visionos-experimental/metal-capability.txt
          if [ "$(uname -m)" = arm64 ] && grep -q '^METAL_DEVICE=' .build/visionos-experimental/metal-capability.txt; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'NOT_RUN: Hosted runner cannot execute the arm64 Metal fixture; physical device validation also pending.' > .build/visionos-experimental/NOT_RUN.txt
          fi
      - name: Upload matching macOS editor
        uses: actions/upload-artifact@v4
        with:
          name: visionos-experimental-editor
          path: bin/godot.macos.editor.arm64
      - name: Render on Metal if runner supports it
        if: steps.capability.outputs.available == 'true'
        env:
          GODOT_MTL_SYNC_MODE: none
        run: python3 misc/scripts/validate_visionos_forward_plus.py --engine bin/godot.macos.editor.arm64 --driver metal --output .build/visionos-experimental
      - name: Upload Metal capability and runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visionos-experimental-metal
          include-hidden-files: true
          path: .build/visionos-experimental/
  device-app:
    name: Export and link unsigned visionOS device app
    needs: [device-build, stereo-metal, reuse-builds, reuse-metal]
    if: >-
      always() &&
      ((needs.device-build.result == 'success' && needs.stereo-metal.result == 'success') ||
       (needs.reuse-builds.result == 'success' && needs.reuse-metal.result == 'success'))
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: visionos-experimental-device
          path: .build/device-artifact
          run-id: ${{ inputs.source_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: visionos-experimental-editor
          path: bin
          run-id: ${{ inputs.source_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Import, export and build the immersive sample without signing
        run: |
          chmod +x bin/godot.macos.editor.arm64
          python3 misc/scripts/validate_visionos_export.py \
            --engine bin/godot.macos.editor.arm64 \
            --template .build/device-artifact/bin/godot_visionos.zip \
            --output .build/visionos-export
      - name: Upload device-owner handoff and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visionos-experimental-handoff
          include-hidden-files: true
          path: |
            .build/visionos-export/xcode-project/
            .build/visionos-export/unsigned-app/
            .build/visionos-export/*.log
            .build/visionos-export/*.json
            .build/visionos-export/*.txt
  reuse-metal:
    name: Rerun Metal fixture with verified native editor
    needs: reuse-builds
    if: inputs.source_run_id != ''
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: visionos-experimental-editor
          path: bin
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Run Metal stereo fixture
        env:
          GODOT_MTL_SYNC_MODE: ${{ inputs.metal_sync_mode == 'none' && 'none' || '' }}
        run: |
          chmod +x bin/godot.macos.editor.arm64
          python3 misc/scripts/validate_visionos_forward_plus.py --engine bin/godot.macos.editor.arm64 --driver metal --output .build/visionos-experimental
      - name: Upload Metal recheck evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visionos-experimental-metal
          include-hidden-files: true
          path: .build/visionos-experimental/
