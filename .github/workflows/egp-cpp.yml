name: EGP C++ editor and exports
on:
  push:
    branches: [master]
    paths: ["core/**", "drivers/**", "editor/**", "modules/**", "platform/**", "scene/**", "servers/**", "doc/classes/**", "misc/scripts/*egp_cpp*", "misc/scripts/*egp_generated_api*", "misc/scripts/*egp_net*", "misc/scripts/egp_engine_process.py", "misc/scripts/test_egp_engine_process.py", "misc/egp/network_lab/process_clock_server.gd", "misc/egp/network_lab/admission_lifecycle.gd", "misc/egp/generated_api/**", "misc/egp/api_contract.json", "tests/networking/**", ".github/workflows/egp-cpp.yml", ".gitmodules", "thirdparty/godot-cpp/**", "xmake.lua", "build/xmake/**", "misc/scripts/build_egp.lua"]
  pull_request:
    paths: ["core/**", "drivers/**", "editor/**", "modules/**", "platform/**", "scene/**", "servers/**", "doc/classes/**", "misc/scripts/*egp_cpp*", "misc/scripts/*egp_generated_api*", "misc/scripts/*egp_net*", "misc/scripts/egp_engine_process.py", "misc/scripts/test_egp_engine_process.py", "misc/egp/network_lab/process_clock_server.gd", "misc/egp/network_lab/admission_lifecycle.gd", "misc/egp/generated_api/**", "misc/egp/api_contract.json", "tests/networking/**", ".github/workflows/egp-cpp.yml", ".gitmodules", "thirdparty/godot-cpp/**", "xmake.lua", "build/xmake/**", "misc/scripts/build_egp.lua"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: egp-cpp-${{ github.head_ref || github.ref_name }}
  # Test the newest source instead of queuing behind an obsolete revision.
  cancel-in-progress: true
jobs:
  native-cpp:
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x86_64
            editor: bin/godot.windows.editor.dev.x86_64.console.exe
            debug: bin/godot.windows.template_debug.x86_64.exe
            release: bin/godot.windows.template_release.x86_64.exe
            flags: d3d12=no
          - os: ubuntu-24.04
            platform: linuxbsd
            arch: x86_64
            editor: bin/godot.linuxbsd.editor.dev.x86_64
            debug: bin/godot.linuxbsd.template_debug.x86_64
            release: bin/godot.linuxbsd.template_release.x86_64
            flags: x11=no wayland=no
          - os: macos-15
            platform: macos
            arch: arm64
            editor: bin/godot.macos.editor.dev.arm64
            debug: bin/godot.macos.template_debug.arm64
            release: bin/godot.macos.template_release.arm64
            flags: metal=no
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/godot-deps
      - name: Build headless validation editor and production templates
        shell: bash
        run: |
          FLAGS="platform=${{ matrix.platform }} arch=${{ matrix.arch }} debug_symbols=no accesskit=no vulkan=no module_mono_enabled=no ${{ matrix.flags }}"
          xmake lua misc/scripts/build_egp.lua "${{ matrix.platform }}" editor 4 .build/xmake-cache "$FLAGS dev_build=yes"
          xmake lua misc/scripts/build_egp.lua "${{ matrix.platform }}" template_debug 4 .build/xmake-cache "$FLAGS"
          xmake lua misc/scripts/build_egp.lua "${{ matrix.platform }}" template_release 4 .build/xmake-cache "$FLAGS"
      - run: python misc/scripts/test_egp_cpp_sdk.py
      - name: Validate Windows SDK builds from deeply nested projects
        if: runner.os == 'Windows'
        run: python misc/scripts/validate_egp_cpp_sdk_paths.py --engine ${{ matrix.editor }} --output .build/sdk-object-paths-ci --jobs 4
      - name: Validate CLI and exported games
        run: python misc/scripts/validate_egp_cpp.py --editor ${{ matrix.editor }} --debug-template ${{ matrix.debug }} --release-template ${{ matrix.release }}
      - name: Compile typed Superposition and interpolation C++ APIs
        run: python misc/scripts/validate_egp_generated_api.py --engine ${{ matrix.editor }} --cpp --output .build/generated-api-cpp
      - name: Validate engine networking, replication, interpolation and physics replay
        run: python misc/scripts/validate_egp_net.py --engine ${{ matrix.editor }} --output .build/engine-networking
      - name: Validate C++ editor workflow and actionable compiler diagnostics
        run: python misc/scripts/validate_egp_cpp_ui.py --engine ${{ matrix.editor }} --output .build/cpp-ui-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpp-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            .build/cpp-qualification/*.log
            .build/cpp-qualification/results.json
            .build/generated-api-cpp/**/receipt.json
            .build/generated-api-cpp/**/*.log
            .build/engine-networking/**
            .build/cpp-ui-ci/**/receipt.json
            .build/cpp-ui-ci/**/editor.log
            .build/sdk-object-paths-ci/**/receipt.json
            .build/sdk-object-paths-ci/**/*.log
