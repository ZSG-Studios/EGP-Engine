name: EGP manual unit test replay

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download identified test editor
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37537447414 --repo ZSG-Studios/EGP --name windows-editor --dir bin
      - name: Replay GDScript and full unit suite
        run: >-
          python misc/scripts/run_egp_unit_replay.py
          --engine bin/godot.windows.editor.x86_64.exe
          --expected-source 0a2186345debb2f0f33eabc1e52e77160e47d9a3
          --expected-sha256 64e4fb57f991678cf4d7efaf6f9f0c08a0389789f7aa9d468442bf4e08a221d3
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: egp-manual-unit-test-replay
          path: .build/unit-replay
