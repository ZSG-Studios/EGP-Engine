name: Physics
# Box2D and Box3D qualification: pinned source verification, native build, upstream test
# suites and cross-platform determinism. Source integrity for every vendored library
# (including these two) is checked in static checks by egp_thirdparty.py.
on:
  workflow_call:
    inputs:
      configurations:
        description: JSON list of build configurations (Debug, Release).
        type: string
        default: '["Release"]'

jobs:
  validate:
    name: ${{ matrix.engine }} · ${{ matrix.os }} · ${{ matrix.configuration }}
    strategy:
      fail-fast: false
      matrix:
        engine: [Box2D, Box3D]
        os: [windows, linux, macos]
        configuration: ${{ fromJSON(inputs.configurations) }}
        # Clang everywhere: pinned LLVM on Linux, Apple Clang (xcode) on macOS.
        # TODO(W9 clang-cl): set `toolchain: clang-cl` for Windows once LLVM is pinned on the runner.
        include:
          - os: windows
            toolchain: ''
          - os: linux
            toolchain: clang
          - os: macos
            toolchain: ''
    runs-on: [self-hosted, 'egp-${{ matrix.os }}']
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Acquire Mac build lock
        if: runner.os == 'macOS'
        uses: ./.github/actions/lock-mac-host
        with:
          mode: acquire

      - name: Validate Box2D
        if: matrix.engine == 'Box2D'
        run: python misc/scripts/validate_box2d.py --configuration ${{ matrix.configuration }} ${{ matrix.toolchain && format('--toolchain {0}', matrix.toolchain) || '' }}

      - name: Validate Box3D
        if: matrix.engine == 'Box3D'
        run: python misc/scripts/validate_box3d.py --config ${{ matrix.configuration }} --upstream-tests ${{ matrix.toolchain && format('--toolchain {0}', matrix.toolchain) || '' }}

      - name: Release Mac build lock
        if: always() && runner.os == 'macOS'
        uses: ./.github/actions/lock-mac-host
        with:
          mode: release

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: physics-${{ matrix.engine }}-${{ matrix.os }}-${{ matrix.configuration }}
          retention-days: 14
          path: |
            .build/box2d-validation/
            .build/box3d-validation/${{ matrix.configuration }}/receipt.json
            .build/box3d-validation/${{ matrix.configuration }}/*.log
          if-no-files-found: ignore
